{% extends "base.html" %}
{% block title %}{{ t.get("stepup.title") }}{% endblock %}
{% block content %}
<h1>{{ t.get("stepup.title") }}</h1>
<p>{{ factor }}</p>
<p>{{ t.get("external.intro") }}</p>
<form method="post" action="/stepup/external">
<input type="hidden" name="csrf" value="{{ csrf }}">
<input type="hidden" name="txn" value="{{ transaction }}">
<input type="hidden" name="factor" value="{{ factor }}">
<label for="external-response">{{ t.get("external.response") }}</label>
<input id="external-response" name="response" type="password" autocomplete="one-time-code" maxlength="4096" required>
<button type="submit">{{ t.get("totp.confirm") }}</button>
</form>
{% endblock %}
