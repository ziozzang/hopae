<p id="webauthn-status" class="status" aria-live="polite" hidden
 data-msg-waiting="{{ t.get("webauthn.waiting") }}"
 data-msg-verifying="{{ t.get("webauthn.verifying") }}"
 data-msg-cancelled="{{ t.get("webauthn.cancelled") }}"
 data-msg-duplicate="{{ t.get("webauthn.duplicate") }}"
 data-msg-security="{{ t.get("webauthn.security") }}"
 data-msg-unsupported="{{ t.get("webauthn.unsupported") }}"
 data-msg-failed="{{ t.get("webauthn.failed") }}"></p>
<noscript><p class="error">{{ t.get("webauthn.noscript") }}</p></noscript>
