{% extends "base.html" %}
{% block title %}{{ t.get("retry.title") }}{% endblock %}
{% block content %}
<h1>{{ t.get("retry.title") }}</h1>
<p>{{ t.get("retry.body") }}</p>
<form method="post" action="/login/retry">
<input type="hidden" name="csrf" value="{{ csrf }}">
<input type="hidden" name="state" value="{{ state }}">
<button type="submit">{{ t.get("retry.button") }}</button>
</form>
{% endblock %}
