{% extends "base.html" %}
{% block title %}{{ t.get("password.title") }}{% endblock %}
{% block content %}
<h1>{{ t.get("password.title") }}</h1>
<p>{{ t.fmt("password.provider", "provider", provider_name) }}</p>
{% if rejected %}<p role="alert">{{ t.get("password.rejected") }}</p>{% endif %}
<form method="post" action="/login/{{ provider_id }}/password">
<input type="hidden" name="csrf" value="{{ csrf }}">
<input type="hidden" name="challenge" value="{{ challenge }}">
<label for="username">{{ t.get("password.username") }}</label>
<input id="username" name="username" type="text" autocomplete="username" maxlength="256" required>
<label for="password">{{ t.get("password.password") }}</label>
<input id="password" name="password" type="password" autocomplete="current-password" maxlength="4096" required>
<button type="submit">{{ t.get("password.submit") }}</button>
</form>
{% endblock %}
