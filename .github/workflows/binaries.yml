name: Native binary qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'tests/**', 'Cargo.*', 'build.rs', 'tools/prepare_release.py', '.github/workflows/binaries.yml']
permissions:
  contents: read
concurrency:
  group: native-binaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add '${{ matrix.target }}'
      - name: Install musl tools
        if: contains(matrix.target, '-musl')
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Unit and boundary qualification
        run: |
          cargo test --locked --lib --target '${{ matrix.target }}'
          python3 tools/check_boundary.py
          python3 tools/check_docs.py --only docs
      - name: Release build
        run: cargo build --locked --release --bin hopae --target '${{ matrix.target }}'
      - name: CLI smoke and release assets
        run: |
          target/${{ matrix.target }}/release/hopae --version
          python3 tools/prepare_release.py --target '${{ matrix.target }}' --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hopae-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
