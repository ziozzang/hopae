syntax = "proto3";
package hangang.hopae.v1;
service Authentication { rpc Verify(VerifyRequest) returns (VerifyReply); }
message Header { string name = 1; bytes value = 2; }
message VerifyRequest { uint64 request_id = 1; repeated Header headers = 2; }
message VerifyReply { uint64 request_id = 1; uint32 status = 2; repeated Header headers = 3; bytes body = 4; }

// Separate opt-in service; ordinary Verify never emits projection receipts.
service AuthenticationReceipts { rpc IssueService(ServiceReceiptRequest) returns (ServiceReceiptReply); rpc ValidateService(ServiceReceiptValidationRequest) returns (ServiceReceiptValidationReply); rpc IssueServiceObserved(ServiceReceiptRequest) returns (ServiceReceiptObservedReply); rpc ObserveServiceTime(ServiceReceiptValidationRequest) returns (ServiceReceiptTimeReply); }
message ServiceReceiptRequest { VerifyRequest verification = 1; string service = 2; string audience = 3; bytes request_sha256 = 4; }
message ReceiptIdentity { string subject_ref = 1; uint32 kind = 2; uint32 aal = 3; uint64 revision = 4; uint64 credential_generation = 5; }
message AuthenticationReceiptContext { string issuer_ref = 1; uint64 key_epoch = 2; string identity_authority_epoch = 3; ReceiptIdentity identity = 4; string service = 5; string audience = 6; bytes request_sha256 = 7; }
message ServiceReceiptReply { uint64 request_id = 1; AuthenticationReceiptContext context = 2; bytes receipt = 3; }

message ServiceReceiptValidationRequest { uint64 request_id = 1; AuthenticationReceiptContext context = 2; bytes receipt = 3; bytes request_sha256 = 4; }
message ServiceReceiptValidationReply { uint64 request_id = 1; uint64 expires_ms = 2; }

// Native owner metadata only. This observation grants no access and contains no secrets.
service ProjectionPlans { rpc Observe(ProjectionPlanRequest) returns (ProjectionPlanReply); }
message ProjectionPlanRequest { uint64 request_id = 1; string service = 2; string audience = 3; uint64 minimum_revision = 4; }
message ProjectionPlanReply { uint64 request_id = 1; uint64 revision = 2; string service = 3; string audience = 4; string resource = 5; string action = 6; uint32 minimum_aal = 7; uint32 cache_ttl_ms = 8; }

// Explicit native credential phase, separate from ordinary authentication.
// Contract 1 contains a bounded Pumgye PermitValidationRequest protobuf, with
// its correlation equal to request_id. No request-selected peer or secret ref.
service CredentialProjection { rpc Project(ProjectionRequest) returns (ProjectionReply); }
message ProjectionRequest { uint64 request_id = 1; uint32 permission_contract = 2; bytes permission_query = 3; }
message ProjectionReply { uint64 request_id = 1; string service = 2; string audience = 3; bytes request_sha256 = 4; string header_name = 5; bytes header_value = 6; uint64 expires_ms = 7; uint64 plan_revision = 8; }

// Explicit owner-relative time contract. Legacy replies cannot imply these facts.
message ServiceReceiptObservedReply { ServiceReceiptReply receipt = 1; ServiceReceiptTimeReply observation = 2; }
message ServiceReceiptTimeReply {
  uint64 request_id = 1; uint64 owner_now_ms = 2; uint32 remaining_ms = 3;
  bytes receipt_sha256 = 4; string clock_domain = 5;
  uint64 profile_revision = 6; uint64 application_generation = 7;
  uint64 key_registry_revision = 8; uint32 cache_ttl_ms = 9;
}

// Contract 2 contains the observed Pumgye PermitValidationRequest. This service
// must authenticate current fixed owners and atomically consume both nonces.
// No UTC expiry is meaningful across the authentication/permit/output domains.
service ObservedCredentialProjection { rpc Project(ProjectionRequest) returns (ObservedProjectionReply); }
message ObservedProjectionReply {
  uint64 request_id = 1; string service = 2; string audience = 3;
  bytes request_sha256 = 4; string header_name = 5; bytes header_value = 6;
  // SHA256 of the exact bounded ProjectionRequest.permission_query bytes.
  bytes chain_sha256 = 7; string output_clock_domain = 8;
  // Own output-source ticks, never auth/permit absolute expiries. remaining_ms
  // floors actual local Duration after final callbacks and secret work.
  uint64 owner_now_ms = 9; uint32 remaining_ms = 10;
  uint64 profile_revision = 11; uint64 application_generation = 12;
  uint64 key_registry_revision = 13; uint64 plan_revision = 14;
  uint32 cache_ttl_ms = 15;
}

// Additive Workload-only observed protocol. These declarations do not register
// handlers or activate a source. Existing Service RPCs stay Service-only.
service WorkloadAuthenticationReceipts {
  rpc IssueObserved(WorkloadReceiptRequest) returns (WorkloadReceiptObservedReply);
  rpc ObserveTime(WorkloadReceiptObservationRequest) returns (WorkloadReceiptTimeReply);
}
message WorkloadReceiptRequest {
  VerifyRequest verification = 1; string service = 2; string audience = 3;
  bytes request_sha256 = 4;
}
message WorkloadReceiptReply {
  uint64 request_id = 1;
  AuthenticationReceiptContext context = 2; // Native Workload kind3, AAL0 only.
  bytes receipt = 3;
}
message WorkloadReceiptObservedReply {
  WorkloadReceiptReply receipt = 1; WorkloadReceiptTimeReply observation = 2;
}
message WorkloadReceiptObservationRequest {
  uint64 request_id = 1; AuthenticationReceiptContext context = 2;
  bytes receipt = 3; bytes request_sha256 = 4;
}
message WorkloadReceiptTimeReply {
  uint64 request_id = 1; uint64 owner_now_ms = 2;
  // Admission only: original pre-authentication maximum1second, never renewed.
  uint32 remaining_ms = 3; bytes receipt_sha256 = 4;
  // Exactly the32 lowercase nonzero hex nonce in signed wobs1 epoch. No prefix.
  string clock_domain = 5;
  uint64 profile_revision = 6; uint64 application_generation = 7;
  uint64 key_registry_revision = 8; uint32 cache_ttl_ms = 9; // Always zero.
}
// Contract3 only; exact bounded Pum Workload PermitValidationRequest bytes.
// Same durable paired auth/permit nonce ledger as existing contracts, never a
// new replay namespace based on RPC method, contract number or principal kind.
service WorkloadObservedCredentialProjection {
  rpc Project(ProjectionRequest) returns (ObservedProjectionReply);
}
