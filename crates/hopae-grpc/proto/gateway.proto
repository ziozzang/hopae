syntax = "proto3";
package hangang.hopae.v1;
service Authentication { rpc Verify(VerifyRequest) returns (VerifyReply); }
message Header { string name = 1; bytes value = 2; }
message VerifyRequest { uint64 request_id = 1; repeated Header headers = 2; }
message VerifyReply { uint64 request_id = 1; uint32 status = 2; repeated Header headers = 3; bytes body = 4; }

// Separate opt-in service; ordinary Verify never emits projection receipts.
service AuthenticationReceipts { rpc IssueService(ServiceReceiptRequest) returns (ServiceReceiptReply); rpc ValidateService(ServiceReceiptValidationRequest) returns (ServiceReceiptValidationReply); }
message ServiceReceiptRequest { VerifyRequest verification = 1; string service = 2; string audience = 3; bytes request_sha256 = 4; }
message ReceiptIdentity { string subject_ref = 1; uint32 kind = 2; uint32 aal = 3; uint64 revision = 4; uint64 credential_generation = 5; }
message AuthenticationReceiptContext { string issuer_ref = 1; uint64 key_epoch = 2; string identity_authority_epoch = 3; ReceiptIdentity identity = 4; string service = 5; string audience = 6; bytes request_sha256 = 7; }
message ServiceReceiptReply { uint64 request_id = 1; AuthenticationReceiptContext context = 2; bytes receipt = 3; }

message ServiceReceiptValidationRequest { uint64 request_id = 1; AuthenticationReceiptContext context = 2; bytes receipt = 3; bytes request_sha256 = 4; }
message ServiceReceiptValidationReply { uint64 request_id = 1; uint64 expires_ms = 2; }

// Native owner metadata only. This observation grants no access and contains no secrets.
service ProjectionPlans { rpc Observe(ProjectionPlanRequest) returns (ProjectionPlanReply); }
message ProjectionPlanRequest { uint64 request_id = 1; string service = 2; string audience = 3; uint64 minimum_revision = 4; }
message ProjectionPlanReply { uint64 request_id = 1; uint64 revision = 2; string service = 3; string audience = 4; string resource = 5; string action = 6; uint32 minimum_aal = 7; uint32 cache_ttl_ms = 8; }

// Explicit native credential phase, separate from ordinary authentication.
// Contract 1 contains a bounded Pumgye PermitValidationRequest protobuf, with
// its correlation equal to request_id. No request-selected peer or secret ref.
service CredentialProjection { rpc Project(ProjectionRequest) returns (ProjectionReply); }
message ProjectionRequest { uint64 request_id = 1; uint32 permission_contract = 2; bytes permission_query = 3; }
message ProjectionReply { uint64 request_id = 1; string service = 2; string audience = 3; bytes request_sha256 = 4; string header_name = 5; bytes header_value = 6; uint64 expires_ms = 7; uint64 plan_revision = 8; }
