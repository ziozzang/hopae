[package]
name = "hopae"
version = "0.0.10"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "A composable authentication gateway with native identity verification and lifecycle management"
repository = "https://github.com/ziozzang/hopae"

[lib]
name = "hopae"
path = "src/lib.rs"

[[bin]]
name = "hopae"
path = "src/main.rs"

[dependencies]
pumgye-grpc = { git = "https://github.com/ziozzang/pumgye", rev = "f6fb7d9a7e92b615d3c2525999b55a66e7a491ac" }
prost = "0.14"
hopae-grpc = { path = "crates/hopae-grpc" }
hangang-runtime = { git = "https://github.com/ziozzang/hangang-runtime", rev = "bf3ba2c0ccfb8603a34b14a30bc52d5112f0677a" }
tonic = { version = "0.14.6", features = ["tls-ring"] }
libc = "0.2"
tower = { version = "0.5", features = ["util"] }
anyhow = "1"
askama = "0.14"
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query", "json"] }
base64 = "0.22"
bytes = "1"
cookie = "0.18"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
form_urlencoded = "1"
hmac = "0.12"
http = "1"
ipnet = "2"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
percent-encoding = "2"
rand = "0.9"
rand_chacha = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zeroize = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
mlua = { version = "0.12.2", default-features = false, features = ["lua54", "vendored"] }
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize"] }
# WebAuthn relying party (ADR-0017). Ceremony state is persisted between the
# two HTTP requests of a ceremony, hence the state-serialisation feature.
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation", "danger-credential-internals", "attestation", "conditional-ui"] }
# webauthn-rs-core links OpenSSL; vendored keeps release binaries static.
openssl = { version = "0.10", features = ["vendored"] }
# Recovery-code hashes (ADR-0017); RustCrypto, MIT/Apache-2.0.
argon2 = "0.5"
# Reads the AAGUID from attestation objects (already a webauthn-rs dependency).
serde_cbor_2 = "0.13"

[features]
# Loopback-only test control surface (clock, stall, commit gate, crash points,
# deterministic RNG). Never enabled in a release build.
test-hooks = []

[dev-dependencies]
# Actual Human paired-runtime qualification uses fixed owning protocol fixtures;
# authentication and permits still come from native Hop/Pum implementations.
guard-grpc = { git = "https://github.com/ziozzang/sumunjang", rev = "1f70428e9481654845a696cf30cdb917a6aef009" }
hangang-route-grpc = { git = "https://github.com/ziozzang/hangang", rev = "dfc099ea763650f98b31110f0720cf3d9042f3ec" }
http-body = "1"
# Exercise the production observed client against native Hopae owners.
hopae-grpc = { path = "crates/hopae-grpc", features = ["native-client"] }
tokio = { version = "1", features = ["process", "io-util"] }
rsa = { version = "0.9", features = ["pem"] }
tempfile = "3"
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softpasskey", "softtoken"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dependencies run optimized in dev/test builds: RSA key generation in the mock
# provider is minutes-slow unoptimized, seconds-fast optimized.
[profile.dev.package."*"]
opt-level = 2

# Local response-frame hardening; provenance and maintenance in vendor/ldap3/HOPAE_PATCH.md.
[patch.crates-io]
ldap3 = { path = "vendor/ldap3" }

[workspace]
members = ["crates/hopae-grpc"]
resolver = "2"
