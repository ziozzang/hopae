[package]
name = "hopae"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "A single-binary identity provider that answers a gateway's forward-authentication check"
repository = "https://github.com/ziozzang/hopae"

[lib]
name = "hopae"
path = "src/lib.rs"

[[bin]]
name = "hopae"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
